name: day bot

# PUBLIC repo (free minutes). Code comes from the private repo Mjeerten/day-trading-desk via tools/publish_bot.sh:
# edit it there, not here. The journal is read from that private repo with the DESK_DATA_TOKEN secret.

# Noise band + overnight sweep + IBS alerts, Monday dip paper alerts (desk/bot.py). Every 15 minutes on weekdays; the bot itself checks the
# New York session times, so the UTC hours cover both summer and winter time.
on:
  schedule:
    - cron: "1,16,31,46 13-21 * * 1-5"
    # Monday dip (paper): hourly from Monday to Wednesday morning, also outside the session (the bot checks the hours)
    - cron: "16 * * * 1-3"
    # Sunday from 19:00 Amsterdam: screenshot reminder (sent once; extra hours because GitHub's schedule can be hours late)
    - cron: "1 17-21 * * 0"
    # 23:00 Amsterdam daily result (desk/autotrade.report) in winter time (22 UTC); summer time is inside 13-21 above
    - cron: "1 22 * * 1-5"
  # GitHub drops most scheduled runs on this repo, so the reliable trigger is an outside timer (cron-job.org)
  # calling workflow_dispatch with {"ref":"main"} every 15 minutes (BOT.md in the private repo).
  workflow_dispatch:
    inputs:
      test:
        description: "Only send a test message to the phone (unticked = a normal check now)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # start the fast runner (fast.yml) and see whether it runs

concurrency:
  group: daybot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ig_blocked: ${{ steps.bot.outputs.ig_blocked }}
    steps:
      - uses: actions/checkout@v5
      - name: private journal (plan, account, IBS missed dates) from Mjeerten/day-trading-desk
        uses: actions/checkout@v5
        with:
          repository: Mjeerten/day-trading-desk
          token: ${{ secrets.DESK_DATA_TOKEN }}
          path: private
          sparse-checkout: journal
      - run: ln -s private/journal journal
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pandas numpy requests websocket-client
      # Fast runner (desk/fast.py, fast.yml): in the session the bot runs ~15-30 s after each candle close from one long
      # job. This run starts it if it belongs to now, and skips its own bot run while it runs (never both at once).
      # Variable FAST_RUNNER = off: never start it.
      - name: fast runner
        id: fast
        if: ${{ !inputs.test }}
        env:
          GH_TOKEN: ${{ github.token }}
          FAST_RUNNER: ${{ vars.FAST_RUNNER }}
        run: |
          if [ "${FAST_RUNNER:-on}" = off ]; then echo "FAST_RUNNER is off"; exit 0; fi
          active=$(gh run list -R "$GITHUB_REPOSITORY" --workflow fast.yml --limit 10 --json status \
                   --jq '[.[] | select(.status != "completed")] | length') || active=0
          if [ "${active:-0}" != 0 ]; then
            echo "the fast runner is running: it does this run's work"; echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$(python -m desk.fast --should-start)" = yes ] && gh workflow run fast.yml -R "$GITHUB_REPOSITORY" --ref main; then
            echo "fast runner started: it does this run's work"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: restore sent-message list
        if: steps.fast.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .daybot
          key: daybot-${{ github.run_id }}
          restore-keys: daybot-
      - name: bot
        id: bot
        if: steps.fast.outputs.skip != 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          T212_OFFSET: ${{ vars.T212_OFFSET }}
          # manual-trading messages: variable PHONE_ALERTS = on | off (default off since 8 Nov 2026: only IG demo messages)
          PHONE_ALERTS: ${{ vars.PHONE_ALERTS || 'off' }}
          STAKE_EUR: ${{ vars.STAKE_EUR }}
          # automatic orders on the IG DEMO (desk/autotrade.py): variable AUTO_TRADE = dry (default) | demo | off
          AUTO_TRADE: ${{ vars.AUTO_TRADE }}
          IG_API_KEY: ${{ secrets.IG_API_KEY }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          # same orders on the Capital.com DEMO (desk/capital.py): variable CAPITAL_TRADE = dry (default) | demo | off
          CAPITAL_TRADE: ${{ vars.CAPITAL_TRADE }}
          CAPITAL_EPIC: ${{ vars.CAPITAL_EPIC }}
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_ACCOUNT_ID: ${{ secrets.CAPITAL_ACCOUNT_ID }}
          # REAL MONEY on Capital.com (off until the owner's go): orders only with variable CAPITAL_LIVE_TRADE = live AND
          # variable CAPITAL_LIVE_GO = yes; size CAPITAL_LIVE_SIZE (1.0, later 1.5) x the month's first balance
          CAPITAL_LIVE_TRADE: ${{ vars.CAPITAL_LIVE_TRADE }}
          CAPITAL_LIVE_GO: ${{ vars.CAPITAL_LIVE_GO }}
          CAPITAL_LIVE_SIZE: ${{ vars.CAPITAL_LIVE_SIZE }}
          CAPITAL_LIVE_API_KEY: ${{ secrets.CAPITAL_LIVE_API_KEY }}
          CAPITAL_LIVE_IDENTIFIER: ${{ secrets.CAPITAL_LIVE_IDENTIFIER }}
          CAPITAL_LIVE_PASSWORD: ${{ secrets.CAPITAL_LIVE_PASSWORD }}
          CAPITAL_LIVE_ACCOUNT_ID: ${{ secrets.CAPITAL_LIVE_ACCOUNT_ID }}
          # same orders on the FTMO account via cTrader (desk/ctrader.py): variable CTRADER_TRADE = dry (default) | demo | off
          CTRADER_TRADE: ${{ vars.CTRADER_TRADE }}
          CTRADER_SIZE: ${{ vars.CTRADER_SIZE }}
          # several FTMO accounts at once (paid challenges): 'account=name:size:target%, ...' (autotrade.ftmo_accounts)
          CTRADER_ACCOUNTS: ${{ vars.CTRADER_ACCOUNTS }}
          CTRADER_ACCOUNT: ${{ vars.CTRADER_ACCOUNT }}
          CTRADER_TARGET: ${{ vars.CTRADER_TARGET }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
        run: python -m desk.bot ${{ inputs.test && '--test' || '' }}
      - name: save sent-message list
        if: always() && steps.fast.outputs.skip != 'true' && hashFiles('.daybot/sent.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .daybot
          key: daybot-${{ github.run_id }}

  # IG's firewall blocks some GitHub servers (HTTP 403 deny page, Nov 2026). The first job then stays quiet and this job
  # runs the bot once more on a fresh server (another address). Messages already sent are not sent again (sent-message
  # list from the first job's cache); only if IG blocks this server too does the phone get the 'problem' message.
  retry:
    needs: run
    if: needs.run.outputs.ig_blocked == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: private journal (plan, account, IBS missed dates) from Mjeerten/day-trading-desk
        uses: actions/checkout@v5
        with:
          repository: Mjeerten/day-trading-desk
          token: ${{ secrets.DESK_DATA_TOKEN }}
          path: private
          sparse-checkout: journal
      - run: ln -s private/journal journal
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pandas numpy requests websocket-client
      - name: restore sent-message list
        uses: actions/cache/restore@v4
        with:
          path: .daybot
          key: daybot-${{ github.run_id }}-retry
          restore-keys: daybot-
      - name: bot
        env:
          IG_RETRY_JOB: "1"   # blocked again here = send the 'problem' message
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          T212_OFFSET: ${{ vars.T212_OFFSET }}
          # manual-trading messages: variable PHONE_ALERTS = on | off (default off since 8 Nov 2026: only IG demo messages)
          PHONE_ALERTS: ${{ vars.PHONE_ALERTS || 'off' }}
          STAKE_EUR: ${{ vars.STAKE_EUR }}
          # automatic orders on the IG DEMO (desk/autotrade.py): variable AUTO_TRADE = dry (default) | demo | off
          AUTO_TRADE: ${{ vars.AUTO_TRADE }}
          IG_API_KEY: ${{ secrets.IG_API_KEY }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          # same orders on the Capital.com DEMO (desk/capital.py): variable CAPITAL_TRADE = dry (default) | demo | off
          CAPITAL_TRADE: ${{ vars.CAPITAL_TRADE }}
          CAPITAL_EPIC: ${{ vars.CAPITAL_EPIC }}
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_ACCOUNT_ID: ${{ secrets.CAPITAL_ACCOUNT_ID }}
          # REAL MONEY on Capital.com (off until the owner's go): orders only with variable CAPITAL_LIVE_TRADE = live AND
          # variable CAPITAL_LIVE_GO = yes; size CAPITAL_LIVE_SIZE (1.0, later 1.5) x the month's first balance
          CAPITAL_LIVE_TRADE: ${{ vars.CAPITAL_LIVE_TRADE }}
          CAPITAL_LIVE_GO: ${{ vars.CAPITAL_LIVE_GO }}
          CAPITAL_LIVE_SIZE: ${{ vars.CAPITAL_LIVE_SIZE }}
          CAPITAL_LIVE_API_KEY: ${{ secrets.CAPITAL_LIVE_API_KEY }}
          CAPITAL_LIVE_IDENTIFIER: ${{ secrets.CAPITAL_LIVE_IDENTIFIER }}
          CAPITAL_LIVE_PASSWORD: ${{ secrets.CAPITAL_LIVE_PASSWORD }}
          CAPITAL_LIVE_ACCOUNT_ID: ${{ secrets.CAPITAL_LIVE_ACCOUNT_ID }}
          # same orders on the FTMO account via cTrader (desk/ctrader.py): variable CTRADER_TRADE = dry (default) | demo | off
          CTRADER_TRADE: ${{ vars.CTRADER_TRADE }}
          CTRADER_SIZE: ${{ vars.CTRADER_SIZE }}
          # several FTMO accounts at once (paid challenges): 'account=name:size:target%, ...' (autotrade.ftmo_accounts)
          CTRADER_ACCOUNTS: ${{ vars.CTRADER_ACCOUNTS }}
          CTRADER_ACCOUNT: ${{ vars.CTRADER_ACCOUNT }}
          CTRADER_TARGET: ${{ vars.CTRADER_TARGET }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
        run: python -m desk.bot ${{ inputs.test && '--test' || '' }}
      - name: save sent-message list
        if: always() && hashFiles('.daybot/sent.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .daybot
          key: daybot-${{ github.run_id }}-retry
